<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>Voice Inbox · 말하면 정리되는 음성 인박스</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <!-- Puter.js: key-less, client-side LLM for triage + RAG answers -->
    <script src="https://js.puter.com/v2/"></script>
  </head>
  <body>
    <header>
      <h1>🎙️ Voice Inbox</h1>
      <p class="tagline">말하면, 알아서 정리됩니다.</p>
      <span id="stats" class="stats"></span>
    </header>

    <!-- HERO: instant voice capture --------------------------------------- -->
    <section class="card capture">
      <button id="micBtn" class="mic" aria-label="녹음 시작">🎙️</button>
      <p id="micHint" class="hint">탭하고 말하세요 · 멈추면 자동 분류됩니다</p>
      <div id="liveText" class="live" aria-live="polite"></div>
      <details class="typefallback">
        <summary>키보드로 입력</summary>
        <div class="row">
          <input id="typeInput" type="text" placeholder="여기에 적고 Enter — 동일하게 분류됩니다" />
          <button id="typeBtn" class="secondary">추가</button>
        </div>
      </details>
    </section>

    <!-- INBOX ------------------------------------------------------------- -->
    <section class="card">
      <div class="row between">
        <label>인박스</label>
        <div class="row" style="gap: 6px">
          <button id="notifyBtn" class="secondary small">🔔 알림 켜기</button>
          <button id="refreshBtn" class="secondary small">새로고침</button>
        </div>
      </div>
      <div id="filters" class="filters">
        <button class="chip active" data-f="all">전체</button>
        <button class="chip" data-f="task">✅ 할일</button>
        <button class="chip" data-f="idea">💡 아이디어</button>
        <button class="chip" data-f="note">📝 메모</button>
        <button class="chip" data-f="question">❓ 질문</button>
      </div>
      <ul id="inbox" class="inbox"></ul>
    </section>

    <!-- ASK / SEARCH over everything ------------------------------------- -->
    <section class="card">
      <label for="q">질문하거나 검색하기 (캡처 + 저장한 링크 전체)</label>
      <div class="row">
        <input id="q" type="text" placeholder="예: 지난주에 사야겠다고 말한 거 뭐였지?" />
        <button id="askBtn">질문</button>
        <button id="searchBtn" class="secondary">검색</button>
      </div>
      <div id="answer" class="answer hidden"></div>
      <div id="results" class="results"></div>
    </section>

    <!-- Secondary: save a link (original Collective Brain ingest) --------- -->
    <section class="card">
      <details>
        <summary>링크 저장 (아티클 · 유튜브 · PDF)</summary>
        <div class="row" style="margin-top: 10px">
          <input id="saveUrl" type="url" placeholder="https://… 링크를 붙여넣으세요" />
          <button id="saveBtn">저장</button>
        </div>
        <p id="saveMsg" class="msg"></p>
      </details>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
